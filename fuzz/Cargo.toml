[package]
name = "mk-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
serde_yaml = { package = "mk_ext_serde_yaml", path = "../crates/serde-yaml" }
serde_json = "1.0.134"
toml = "0.8.19"

[dependencies.mk_lib]
package = "mk"
path = ".."

[[bin]]
name = "fuzz_config_parse"
path = "fuzz_targets/fuzz_config_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_label_filter"
path = "fuzz_targets/fuzz_label_filter.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_make_parse"
path = "fuzz_targets/fuzz_make_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_template_interpolate"
path = "fuzz_targets/fuzz_template_interpolate.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_matrix_selector"
path = "fuzz_targets/fuzz_matrix_selector.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_env_parse"
path = "fuzz_targets/fuzz_env_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_cache_deserialize"
path = "fuzz_targets/fuzz_cache_deserialize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_vault_meta"
path = "fuzz_targets/fuzz_vault_meta.rs"
test = false
doc = false
bench = false
