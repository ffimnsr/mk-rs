[package]
name = "mk-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
hashbrown = "0.16.1"
serde_yaml = { package = "mk_ext_serde_yaml", path = "../crates/serde-yaml" }
serde_json = "1.0.134"
toml = "0.8.19"

[dependencies.mk_lib]
package = "mk"
path = ".."

[[bin]]
name = "fuzz_config_parse"
path = "fuzz_targets/fuzz_config_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_label_filter"
path = "fuzz_targets/fuzz_label_filter.rs"
test = false
doc = false
bench = false
