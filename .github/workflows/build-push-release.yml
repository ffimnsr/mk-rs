name: Release

# Tag pushes release only when the resolved code commit already has green CI.
# The workflow_run trigger handles the opposite ordering (tag before CI finishes).
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  verify-release:
    name: Verify release inputs
    runs-on: ubuntu-latest
    outputs:
      mk_version: ${{ steps.release.outputs.mk_version }}
      release_ref: ${{ steps.release.outputs.release_ref }}
      should_build: ${{ steps.release.outputs.should_build }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - name: Resolve release target
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_RUN_EVENT: ${{ github.event.workflow_run.event }}
          WORKFLOW_RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          EVENT="${GITHUB_EVENT_NAME}"
          SHOULD_BUILD=false
          PUBLISH=false
          RELEASE_REF="${GITHUB_REF}"
          VERSION=""
          CI_SHA=""
          TAG_SHA=""

          resolve_ci_commit() {
            local target="$1"
            while true; do
              local parent
              if ! parent="$(git rev-parse "${target}^" 2>/dev/null)"; then
                break
              fi

              local changed
              changed="$(git diff --name-only "${parent}" "${target}" || true)"

              # Empty or documentation-only commits reuse the parent's CI run.
              # Keep this pattern in sync with .github/workflows/ci.yml.
              if [[ -z "${changed}" ]] || ! grep -Evq '^(docs/|wiki/|LICENSE|COPYRIGHT|[^/]+\.md$)' <<< "${changed}"; then
                target="${parent}"
                continue
              fi

              break
            done

            printf '%s\n' "${target}"
          }

          has_successful_ci() {
            local sha="$1"
            local runs_json
            if ! runs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${sha}&per_page=100" 2>/dev/null)"; then
              return 1
            fi

            jq -e '[.workflow_runs[] | select(.event == "push" and .head_branch == "main" and .status == "completed" and .conclusion == "success")] | length > 0' \
              <<< "${runs_json}" >/dev/null
          }

          skip_release() {
            echo "$1"
            echo "mk_version=" >> "${GITHUB_OUTPUT}"
            echo "release_ref=${RELEASE_REF}" >> "${GITHUB_OUTPUT}"
            echo "should_build=false" >> "${GITHUB_OUTPUT}"
            echo "publish=false" >> "${GITHUB_OUTPUT}"
            exit 0
          }

          case "${EVENT}" in
            push)
              VERSION="${GITHUB_REF_NAME}"
              TAG_SHA="${GITHUB_SHA}"
              RELEASE_REF="${GITHUB_REF}"

              if ! grep -q "version = \"${VERSION}\"" <(git show "${TAG_SHA}:Cargo.toml"); then
                echo "Tag ${VERSION} does not match Cargo.toml at ${TAG_SHA}" >&2
                exit 1
              fi

              CI_SHA="$(resolve_ci_commit "${TAG_SHA}")"
              if ! has_successful_ci "${CI_SHA}"; then
                skip_release "CI for ${CI_SHA} is not green yet; the CI workflow_run trigger will release after it completes."
              fi

              SHOULD_BUILD=true
              PUBLISH=true
              ;;
            workflow_run)
              if [[ "${WORKFLOW_RUN_CONCLUSION}" != "success" || "${WORKFLOW_RUN_EVENT}" != "push" || "${WORKFLOW_RUN_BRANCH}" != "main" ]]; then
                skip_release "Skipping CI workflow_run: conclusion=${WORKFLOW_RUN_CONCLUSION} event=${WORKFLOW_RUN_EVENT} branch=${WORKFLOW_RUN_BRANCH}"
              fi

              CI_SHA="${WORKFLOW_RUN_HEAD_SHA}"
              VERSION="$(git show "${CI_SHA}:Cargo.toml" | grep '^version = ' | head -n1 | cut -d '"' -f2)"
              RELEASE_REF="refs/tags/${VERSION}"

              if ! TAG_SHA="$(git rev-list -n1 "${RELEASE_REF}" 2>/dev/null)"; then
                skip_release "No tag ${VERSION} found for CI commit ${CI_SHA}."
              fi

              if [[ "$(resolve_ci_commit "${TAG_SHA}")" != "${CI_SHA}" ]]; then
                skip_release "Tag ${VERSION} does not resolve to CI commit ${CI_SHA}."
              fi

              SHOULD_BUILD=true
              PUBLISH=true
              ;;
            workflow_dispatch)
              VERSION="$(grep '^version = ' Cargo.toml | head -n1 | cut -d '"' -f2)"
              SHOULD_BUILD=true
              PUBLISH=false
              ;;
            *)
              skip_release "Unsupported event ${EVENT}."
              ;;
          esac

          if [[ "${PUBLISH}" == true ]] && gh release view "${VERSION}" --json tagName >/dev/null 2>&1; then
            skip_release "Release ${VERSION} already exists; nothing to do."
          fi

          echo "MK_VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "mk_version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "release_ref=${RELEASE_REF}" >> "${GITHUB_OUTPUT}"
          echo "should_build=${SHOULD_BUILD}" >> "${GITHUB_OUTPUT}"
          echo "publish=${PUBLISH}" >> "${GITHUB_OUTPUT}"

          if [[ "${CI_SHA}" == "${GITHUB_SHA}" ]]; then
            echo "Release ${VERSION}: tag commit requires its own CI run (${CI_SHA})"
          elif [[ -n "${CI_SHA}" ]]; then
            echo "Release ${VERSION}: using CI from ${CI_SHA} (tag commit ${GITHUB_SHA} has no code changes)"
          else
            echo "Release ${VERSION}: manual build without publishing"
          fi

  build-release-package:
    name: Build package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs:
      - verify-release
    if: needs.verify-release.outputs.should_build == 'true'
    continue-on-error: true
    env:
      CARGO: cargo
      TARGET_FLAGS: ""
      TARGET_DIR: ./target
      RUST_BACKTRACE: 1
      MK_VERSION: ${{ needs.verify-release.outputs.mk_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: stable-musl
            os: ubuntu-latest
            rust: stable
            target: x86_64-unknown-linux-musl
            strip: strip
          - build: stable-x86-gnu
            os: ubuntu-latest
            rust: stable
            target: i686-unknown-linux-gnu
            strip: i686-linux-gnu-strip
          - build: stable-arm-gnueabihf
            os: ubuntu-latest
            rust: stable
            target: arm-unknown-linux-gnueabihf
            strip: arm-linux-gnueabihf-strip
          - build: stable-armv7-gnueabihf
            os: ubuntu-latest
            rust: stable
            target: armv7-unknown-linux-gnueabihf
            strip: arm-linux-gnueabihf-strip
          - build: stable-armv7-musleabihf
            os: ubuntu-latest
            rust: stable
            target: armv7-unknown-linux-musleabihf
          - build: stable-armv7-musleabi
            os: ubuntu-latest
            rust: stable
            target: armv7-unknown-linux-musleabi
          - build: stable-aarch64
            os: ubuntu-latest
            rust: stable
            target: aarch64-unknown-linux-gnu
            strip: aarch64-linux-gnu-strip
          - build: stable-s390x
            os: ubuntu-latest
            rust: stable
            target: s390x-unknown-linux-gnu
            strip: s390x-linux-gnu-strip
          - build: macos-aarch64
            os: macos-14
            rust: nightly
            target: aarch64-apple-darwin
          - build: win-msvc
            os: windows-latest
            rust: nightly
            target: x86_64-pc-windows-msvc
          - build: win32-msvc
            os: windows-latest
            rust: nightly
            target: i686-pc-windows-msvc
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.verify-release.outputs.release_ref }}
      - name: Install packages (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          ci/ubuntu-install-packages
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          target: ${{ matrix.target }}
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          # Isolate cache per target: cross containers must never reuse host
          # proc-macro artifacts built against a different glibc.
          shared-key: mk-release-${{ runner.os }}-${{ matrix.target }}
          cache-on-failure: "true"
      - name: Install cross
        if: matrix.os == 'ubuntu-latest' && matrix.target != ''
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Set cross environment
        if: matrix.os == 'ubuntu-latest' && matrix.target != ''
        shell: bash
        run: echo "CARGO=cross" >> $GITHUB_ENV
      - name: Set target variables
        shell: bash
        run: |
          echo "TARGET_FLAGS=--target ${{ matrix.target }}" >> $GITHUB_ENV
          echo "TARGET_DIR=./target/${{ matrix.target }}" >> $GITHUB_ENV
      - name: Show command used for Cargo
        run: |
          echo "cargo command is: ${{ env.CARGO }}"
          echo "target flag is: ${{ env.TARGET_FLAGS }}"
          echo "target dir is: ${{ env.TARGET_DIR }}"
      - name: Build release binary and dependency crates
        run: ${{ env.CARGO }} build --locked --verbose --release ${{ env.TARGET_FLAGS }}
      - name: Strip release binary (macos)
        if: contains(matrix.target, 'apple-darwin')
        run: strip "target/${{ matrix.target }}/release/mk"
      - name: Strip release binary (linux cross-compiled)
        if: matrix.os == 'ubuntu-latest' && matrix.strip != ''
        run: |
          case "${{ matrix.target }}" in
            i686-unknown-linux-gnu)
              sudo apt-get install -y --no-install-recommends binutils-i686-linux-gnu ;;
            arm-unknown-linux-gnueabihf|armv7-unknown-linux-gnueabihf)
              sudo apt-get install -y --no-install-recommends binutils-arm-linux-gnueabihf ;;
            aarch64-unknown-linux-gnu)
              sudo apt-get install -y --no-install-recommends binutils-aarch64-linux-gnu ;;
            s390x-unknown-linux-gnu)
              sudo apt-get install -y --no-install-recommends binutils-s390x-linux-gnu ;;
          esac
          ${{ matrix.strip }} target/${{ matrix.target }}/release/mk
      - name: Generate man pages
        if: matrix.os != 'windows-latest'
        run: cargo run --locked --bin mk-manpages -- target/man/man1
      - name: Build archive
        shell: bash
        run: |
          set -euo pipefail

          archive_target="mk-${MK_VERSION}-${{ matrix.target }}"
          mkdir -p "$archive_target"

          cp README.md LICENSE-APACHE LICENSE-MIT COPYRIGHT "$archive_target/"

          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/mk.exe" "$archive_target/"
            7z a "$archive_target.zip" "$archive_target"
            sha256sum "$archive_target.zip" | awk -v name="$archive_target.zip" '{print $1 "  " name}' > "$archive_target.zip.sha256"
            echo "ASSET=$archive_target.zip" >> $GITHUB_ENV
            echo "ASSET_SUM=$archive_target.zip.sha256" >> $GITHUB_ENV
          else
            cp "target/${{ matrix.target }}/release/mk" "$archive_target/"
            mkdir -p "$archive_target/man"
            cp -R target/man/man1 "$archive_target/man/"

            tar czf "$archive_target.tar.gz" "$archive_target"
            shasum -a 256 "$archive_target.tar.gz" | awk -v name="$archive_target.tar.gz" '{print $1 "  " name}' > "$archive_target.tar.gz.sha256"
            echo "ASSET=$archive_target.tar.gz" >> $GITHUB_ENV
            echo "ASSET_SUM=$archive_target.tar.gz.sha256" >> $GITHUB_ENV
          fi
      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET_SUM }}

  build-release-deb:
    name: Build deb package
    runs-on: ubuntu-latest
    needs:
      - verify-release
    if: needs.verify-release.outputs.should_build == 'true'
    continue-on-error: true
    env:
      CARGO: cargo
      TARGET: x86_64-unknown-linux-musl
      TARGET_FLAGS: ""
      TARGET_DIR: ./target
      RUST_BACKTRACE: 1
      MK_VERSION: ${{ needs.verify-release.outputs.mk_version }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.verify-release.outputs.release_ref }}
      - name: Install packages (Ubuntu)
        run: |
          ci/ubuntu-install-packages
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          target: ${{ env.TARGET }}
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: mk-release-${{ runner.os }}-deb
          cache-on-failure: "true"
      - name: Install cargo-deb
        shell: bash
        run: cargo install cargo-deb --locked
      - name: Build release binary
        run: ${{ env.CARGO }} build --locked --verbose --release --target ${{ env.TARGET }} ${{ env.TARGET_FLAGS }}
      - name: Generate man pages
        run: cargo run --locked --bin mk-manpages -- target/man/man1
      - name: Build deb package
        run: ${{ env.CARGO }} deb --target ${{ env.TARGET }}
      - name: Build archive
        shell: bash
        run: |
          set -euo pipefail

          deb_target="mk_${MK_VERSION}-1_amd64.deb"
          mv "target/${{ env.TARGET }}/debian/$deb_target" .
          shasum -a 256 "$deb_target" | awk -v name="$deb_target" '{print $1 "  " name}' > "$deb_target.sha256"
          echo "ASSET=$deb_target" >> $GITHUB_ENV
          echo "ASSET_SUM=$deb_target.sha256" >> $GITHUB_ENV
      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-deb
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET_SUM }}

  build-release-rpm:
    name: Build rpm package
    runs-on: ubuntu-latest
    continue-on-error: true
    needs:
      - verify-release
    if: needs.verify-release.outputs.should_build == 'true'
    env:
      CARGO: cargo
      TARGET: x86_64-unknown-linux-musl
      TARGET_FLAGS: ""
      TARGET_DIR: ./target
      RUST_BACKTRACE: 1
      MK_VERSION: ${{ needs.verify-release.outputs.mk_version }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.verify-release.outputs.release_ref }}
      - name: Install packages (Ubuntu)
        run: |
          ci/ubuntu-install-packages
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          target: ${{ env.TARGET }}
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: mk-release-${{ runner.os }}-rpm
          cache-on-failure: "true"
      - name: Build release binary
        run: ${{ env.CARGO }} build --locked --verbose --release --target ${{ env.TARGET }} ${{ env.TARGET_FLAGS }}
      - name: Build rpm package
        run: |
          sudo apt-get install -y rpm
          mkdir -p dist/rpm/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp target/${{ env.TARGET }}/release/mk dist/rpm/SOURCES/
          cp COPYRIGHT LICENSE-APACHE LICENSE-MIT README.md dist/rpm/SOURCES/
          ls dist/rpm/SOURCES

          cat << EOF > dist/rpm/SPECS/mk.spec
          Name: mk
          Version: ${{ env.MK_VERSION }}
          Release: 1
          Summary: Yet another simple task runner.
          License: MIT
          URL: https://github.com/ffimnsr/mk-rs
          BuildArch: $(uname -m)

          %description
          mk is a powerful and flexible task runner designed to help you automate
          and manage your tasks efficiently. It supports running commands both
          locally and inside containers, making it versatile for various environments
          and use cases. Running tasks in containers is a first-class citizen,
          ensuring seamless integration with containerized workflows.

          %install
          mkdir -p %{buildroot}%{_bindir}
          mkdir -p %{buildroot}%{_docdir}/mk-${{ env.MK_VERSION }}
          mkdir -p %{buildroot}%{_datadir}/licenses/mk-${{ env.MK_VERSION }}
          cp %{_sourcedir}/mk %{buildroot}%{_bindir}/mk
          cp %{_sourcedir}/README.md %{buildroot}%{_docdir}/mk-${{ env.MK_VERSION }}/README.md
          cp %{_sourcedir}/COPYRIGHT %{buildroot}%{_datadir}/licenses/mk-${{ env.MK_VERSION }}/COPYRIGHT
          cp %{_sourcedir}/LICENSE-APACHE %{buildroot}%{_datadir}/licenses/mk-${{ env.MK_VERSION }}/LICENSE-APACHE
          cp %{_sourcedir}/LICENSE-MIT %{buildroot}%{_datadir}/licenses/mk-${{ env.MK_VERSION }}/LICENSE-MIT

          %files
          %{_bindir}/mk
          %license COPYRIGHT LICENSE-APACHE LICENSE-MIT
          %doc README.md

          %define __strip /bin/true
          %define __spec_install_post %{nil}
          EOF

          rpmbuild -bb --define "_topdir $(pwd)/dist/rpm" dist/rpm/SPECS/mk.spec
          find dist/rpm/RPMS -name '*.rpm' -exec mv {} dist/mk-${{ env.MK_VERSION }}.x86_64.rpm \;
      - name: Build hash
        shell: bash
        run: |
          set -euo pipefail

          rpm_target="mk-${MK_VERSION}.x86_64.rpm"
          mv "dist/mk-${MK_VERSION}.x86_64.rpm" .
          shasum -a 256 "$rpm_target" | awk -v name="$rpm_target" '{print $1 "  " name}' > "$rpm_target.sha256"
          echo "ASSET=$rpm_target" >> $GITHUB_ENV
          echo "ASSET_SUM=$rpm_target.sha256" >> $GITHUB_ENV
      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-rpm
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET_SUM }}

  publish-release:
    name: Publish release
    needs:
      - verify-release
      - build-release-package
      - build-release-deb
      - build-release-rpm
    runs-on: ubuntu-latest
    if: always() && needs.verify-release.result == 'success' && needs.verify-release.outputs.publish == 'true'
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify-release.outputs.mk_version }}
          name: ${{ needs.verify-release.outputs.mk_version }}
          generate_release_notes: true
          files: |
            *.tar.gz
            *.tar.gz.sha256
            *.zip
            *.zip.sha256
            *.deb
            *.deb.sha256
            *.rpm
            *.rpm.sha256

  build-release-image:
    name: Build release image
    runs-on: ubuntu-latest
    needs:
      - verify-release
    if: needs.verify-release.outputs.should_build == 'true'
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
      MK_VERSION: ${{ needs.verify-release.outputs.mk_version }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ needs.verify-release.outputs.release_ref }}
      - name: Install cosign
        if: needs.verify-release.outputs.publish == 'true'
        uses: sigstore/cosign-installer@v4.1.1
        with:
          cosign-release: 'v3.0.5'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log into registry ${{ env.REGISTRY }}
        if: needs.verify-release.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ needs.verify-release.outputs.publish == 'true' }}
            type=semver,pattern={{version}},value=${{ env.MK_VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.MK_VERSION }}
            type=semver,pattern={{major}},value=${{ env.MK_VERSION }}
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64
          push: ${{ needs.verify-release.outputs.publish == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Sign the published Docker image
        if: needs.verify-release.outputs.publish == 'true'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}