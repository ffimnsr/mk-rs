name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release:
    name: Verify release inputs
    runs-on: ubuntu-latest
    outputs:
      mk_version: ${{ steps.version.outputs.mk_version }}
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: mk-release-${{ runner.os }}
          cache-on-failure: "true"
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="$(grep '^version = ' Cargo.toml | head -n1 | cut -d '"' -f2)"
          fi

          echo "MK_VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "mk_version=${VERSION}" >> "${GITHUB_OUTPUT}"
      - name: Show the version
        run: |
          echo "version is: $MK_VERSION"
      - name: Check that tag version and Cargo.toml version are the same
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          if ! grep -q "version = \"$MK_VERSION\"" Cargo.toml; then
            echo "version does not match Cargo.toml" >&2
            exit 1
          fi
      - name: Run cargo check tool
        run: cargo check --locked --verbose

  build-release-package:
    name: Build package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs:
      - verify-release
    continue-on-error: true
    env:
      CARGO: cargo
      TARGET_FLAGS: ""
      TARGET_DIR: ./target
      RUST_BACKTRACE: 1
      MK_VERSION: ${{ needs.verify-release.outputs.mk_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: stable-musl
            os: ubuntu-latest
            rust: stable
            target: x86_64-unknown-linux-musl
            strip: strip
          - build: stable-x86-gnu
            os: ubuntu-latest
            rust: stable
            target: i686-unknown-linux-gnu
            strip: i686-linux-gnu-strip
          - build: stable-arm-gnueabihf
            os: ubuntu-latest
            rust: stable
            target: arm-unknown-linux-gnueabihf
            strip: arm-linux-gnueabihf-strip
          - build: stable-armv7-gnueabihf
            os: ubuntu-latest
            rust: stable
            target: armv7-unknown-linux-gnueabihf
            strip: arm-linux-gnueabihf-strip
          - build: stable-armv7-musleabihf
            os: ubuntu-latest
            rust: stable
            target: armv7-unknown-linux-musleabihf
          - build: stable-armv7-musleabi
            os: ubuntu-latest
            rust: stable
            target: armv7-unknown-linux-musleabi
          - build: stable-aarch64
            os: ubuntu-latest
            rust: stable
            target: aarch64-unknown-linux-gnu
            strip: aarch64-linux-gnu-strip
          - build: stable-s390x
            os: ubuntu-latest
            rust: stable
            target: s390x-unknown-linux-gnu
            strip: s390x-linux-gnu-strip
          - build: macos-aarch64
            os: macos-14
            rust: nightly
            target: aarch64-apple-darwin
          - build: win-msvc
            os: windows-latest
            rust: nightly
            target: x86_64-pc-windows-msvc
          - build: win32-msvc
            os: windows-latest
            rust: nightly
            target: i686-pc-windows-msvc
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Install packages (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          ci/ubuntu-install-packages
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          target: ${{ matrix.target }}
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: mk-release-${{ runner.os }}
          cache-on-failure: "true"
      - name: Install cross
        if: matrix.os == 'ubuntu-latest' && matrix.target != ''
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Set cross environment
        if: matrix.os == 'ubuntu-latest' && matrix.target != ''
        shell: bash
        run: echo "CARGO=cross" >> $GITHUB_ENV
      - name: Set target variables
        shell: bash
        run: |
          echo "TARGET_FLAGS=--target ${{ matrix.target }}" >> $GITHUB_ENV
          echo "TARGET_DIR=./target/${{ matrix.target }}" >> $GITHUB_ENV
      - name: Show command used for Cargo
        run: |
          echo "cargo command is: ${{ env.CARGO }}"
          echo "target flag is: ${{ env.TARGET_FLAGS }}"
          echo "target dir is: ${{ env.TARGET_DIR }}"
      - name: Build release binary and dependency crates
        run: ${{ env.CARGO }} build --locked --verbose --release ${{ env.TARGET_FLAGS }}
      - name: Strip release binary (macos)
        if: contains(matrix.target, 'apple-darwin')
        run: strip "target/${{ matrix.target }}/release/mk"
      - name: Strip release binary (linux cross-compiled)
        if: matrix.os == 'ubuntu-latest' && matrix.strip != ''
        run: |
          case "${{ matrix.target }}" in
            i686-unknown-linux-gnu)
              sudo apt-get install -y --no-install-recommends binutils-i686-linux-gnu ;;
            arm-unknown-linux-gnueabihf|armv7-unknown-linux-gnueabihf)
              sudo apt-get install -y --no-install-recommends binutils-arm-linux-gnueabihf ;;
            aarch64-unknown-linux-gnu)
              sudo apt-get install -y --no-install-recommends binutils-aarch64-linux-gnu ;;
            s390x-unknown-linux-gnu)
              sudo apt-get install -y --no-install-recommends binutils-s390x-linux-gnu ;;
          esac
          ${{ matrix.strip }} target/${{ matrix.target }}/release/mk
      - name: Generate man pages
        if: matrix.os != 'windows-latest'
        run: cargo run --locked --bin mk-manpages -- target/man/man1
      - name: Build archive
        shell: bash
        run: |
          set -euo pipefail

          archive_target="mk-${MK_VERSION}-${{ matrix.target }}"
          mkdir -p "$archive_target"

          cp README.md LICENSE-APACHE LICENSE-MIT COPYRIGHT "$archive_target/"

          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/mk.exe" "$archive_target/"
            7z a "$archive_target.zip" "$archive_target"
            sha256sum "$archive_target.zip" | awk -v name="$archive_target.zip" '{print $1 "  " name}' > "$archive_target.zip.sha256"
            echo "ASSET=$archive_target.zip" >> $GITHUB_ENV
            echo "ASSET_SUM=$archive_target.zip.sha256" >> $GITHUB_ENV
          else
            cp "target/${{ matrix.target }}/release/mk" "$archive_target/"
            mkdir -p "$archive_target/man"
            cp -R target/man/man1 "$archive_target/man/"

            tar czf "$archive_target.tar.gz" "$archive_target"
            shasum -a 256 "$archive_target.tar.gz" | awk -v name="$archive_target.tar.gz" '{print $1 "  " name}' > "$archive_target.tar.gz.sha256"
            echo "ASSET=$archive_target.tar.gz" >> $GITHUB_ENV
            echo "ASSET_SUM=$archive_target.tar.gz.sha256" >> $GITHUB_ENV
          fi
      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET_SUM }}

  build-release-deb:
    name: Build deb package
    runs-on: ubuntu-latest
    needs:
      - verify-release
    continue-on-error: true
    env:
      CARGO: cargo
      TARGET: x86_64-unknown-linux-musl
      TARGET_FLAGS: ""
      TARGET_DIR: ./target
      RUST_BACKTRACE: 1
      MK_VERSION: ${{ needs.verify-release.outputs.mk_version }}
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Install packages (Ubuntu)
        run: |
          ci/ubuntu-install-packages
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          target: ${{ env.TARGET }}
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: mk-release-${{ runner.os }}
          cache-on-failure: "true"
      - name: Install cargo-deb
        shell: bash
        run: cargo install cargo-deb --locked
      - name: Build release binary
        run: ${{ env.CARGO }} build --locked --verbose --release --target ${{ env.TARGET }} ${{ env.TARGET_FLAGS }}
      - name: Generate man pages
        run: cargo run --locked --bin mk-manpages -- target/man/man1
      - name: Build deb package
        run: ${{ env.CARGO }} deb --target ${{ env.TARGET }}
      - name: Build archive
        shell: bash
        run: |
          set -euo pipefail

          deb_target="mk_${MK_VERSION}-1_amd64.deb"
          mv "target/${{ env.TARGET }}/debian/$deb_target" .
          shasum -a 256 "$deb_target" | awk -v name="$deb_target" '{print $1 "  " name}' > "$deb_target.sha256"
          echo "ASSET=$deb_target" >> $GITHUB_ENV
          echo "ASSET_SUM=$deb_target.sha256" >> $GITHUB_ENV
      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-deb
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET_SUM }}

  build-release-rpm:
    name: Build rpm package
    runs-on: ubuntu-latest
    continue-on-error: true
    needs:
      - verify-release
    env:
      CARGO: cargo
      TARGET: x86_64-unknown-linux-musl
      TARGET_FLAGS: ""
      TARGET_DIR: ./target
      RUST_BACKTRACE: 1
      MK_VERSION: ${{ needs.verify-release.outputs.mk_version }}
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Install packages (Ubuntu)
        run: |
          ci/ubuntu-install-packages
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          target: ${{ env.TARGET }}
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: mk-release-${{ runner.os }}
          cache-on-failure: "true"
      - name: Build release binary
        run: ${{ env.CARGO }} build --locked --verbose --release --target ${{ env.TARGET }} ${{ env.TARGET_FLAGS }}
      - name: Build rpm package
        run: |
          sudo apt-get install -y rpm
          mkdir -p dist/rpm/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp target/${{ env.TARGET }}/release/mk dist/rpm/SOURCES/
          cp COPYRIGHT LICENSE-APACHE LICENSE-MIT README.md dist/rpm/SOURCES/
          ls dist/rpm/SOURCES

          cat << EOF > dist/rpm/SPECS/mk.spec
          Name: mk
          Version: ${{ env.MK_VERSION }}
          Release: 1
          Summary: Yet another simple task runner.
          License: MIT
          URL: https://github.com/ffimnsr/mk-rs
          BuildArch: $(uname -m)

          %description
          mk is a powerful and flexible task runner designed to help you automate
          and manage your tasks efficiently. It supports running commands both
          locally and inside containers, making it versatile for various environments
          and use cases. Running tasks in containers is a first-class citizen,
          ensuring seamless integration with containerized workflows.

          %install
          mkdir -p %{buildroot}%{_bindir}
          mkdir -p %{buildroot}%{_docdir}/mk-${{ env.MK_VERSION }}
          mkdir -p %{buildroot}%{_datadir}/licenses/mk-${{ env.MK_VERSION }}
          cp %{_sourcedir}/mk %{buildroot}%{_bindir}/mk
          cp %{_sourcedir}/README.md %{buildroot}%{_docdir}/mk-${{ env.MK_VERSION }}/README.md
          cp %{_sourcedir}/COPYRIGHT %{buildroot}%{_datadir}/licenses/mk-${{ env.MK_VERSION }}/COPYRIGHT
          cp %{_sourcedir}/LICENSE-APACHE %{buildroot}%{_datadir}/licenses/mk-${{ env.MK_VERSION }}/LICENSE-APACHE
          cp %{_sourcedir}/LICENSE-MIT %{buildroot}%{_datadir}/licenses/mk-${{ env.MK_VERSION }}/LICENSE-MIT

          %files
          %{_bindir}/mk
          %license COPYRIGHT LICENSE-APACHE LICENSE-MIT
          %doc README.md

          %define __strip /bin/true
          %define __spec_install_post %{nil}
          EOF

          rpmbuild -bb --define "_topdir $(pwd)/dist/rpm" dist/rpm/SPECS/mk.spec
          find dist/rpm/RPMS -name '*.rpm' -exec mv {} dist/mk-${{ env.MK_VERSION }}.x86_64.rpm \;
      - name: Build hash
        shell: bash
        run: |
          set -euo pipefail

          rpm_target="mk-${MK_VERSION}.x86_64.rpm"
          mv "dist/mk-${MK_VERSION}.x86_64.rpm" .
          shasum -a 256 "$rpm_target" | awk -v name="$rpm_target" '{print $1 "  " name}' > "$rpm_target.sha256"
          echo "ASSET=$rpm_target" >> $GITHUB_ENV
          echo "ASSET_SUM=$rpm_target.sha256" >> $GITHUB_ENV
      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-rpm
          path: |
            ${{ env.ASSET }}
            ${{ env.ASSET_SUM }}

  publish-release:
    name: Publish release
    needs:
      - verify-release
      - build-release-package
      - build-release-deb
      - build-release-rpm
    runs-on: ubuntu-latest
    if: always() && github.ref_type == 'tag' && needs.verify-release.result == 'success'
    steps:
      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify-release.outputs.mk_version }}
          name: ${{ needs.verify-release.outputs.mk_version }}
          generate_release_notes: true
          files: |
            *.tar.gz
            *.tar.gz.sha256
            *.zip
            *.zip.sha256
            *.deb
            *.deb.sha256
            *.rpm
            *.rpm.sha256

  build-release-image:
    name: Build release image
    runs-on: ubuntu-latest
    needs:
      - verify-release
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
      MK_VERSION: ${{ needs.verify-release.outputs.mk_version }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Install cosign
        if: github.ref_type == 'tag'
        uses: sigstore/cosign-installer@v4.1.1
        with:
          cosign-release: 'v3.0.5'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log into registry ${{ env.REGISTRY }}
        if: github.ref_type == 'tag'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=semver,pattern={{version}},value=${{ env.MK_VERSION }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.MK_VERSION }}
            type=semver,pattern={{major}},value=${{ env.MK_VERSION }}
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Sign the published Docker image
        if: github.ref_type == 'tag'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}