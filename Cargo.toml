[package]
name = "mk"
version = "0.7.16"
authors = ["Edward Fitz Abucay <gh:@ffimnsr>"]
edition = "2021"
readme = "README.md"
description = "Yet another simple task runner 🦀"
categories = ["command-line-utilities", "development-tools"]
homepage = "https://github.com/ffimnsr/mk-rs"
repository = "https://github.com/ffimnsr/mk-rs"
license = "MIT OR Apache-2.0"
keywords = ["command-line", "task-runner", "cli", "runner", "utility"]
exclude = [
  ".gitignore",
  "/.githooks/",
  "/.github/",
  "/ci/",
  "/docs/",
]

[lib]
name = "mk_lib"
path = "src/lib.rs"

[[bin]]
name = "mk"
path = "src/cli/bin/main.rs"

[workspace]
members = [
  "crates/prettytable-rs",
  "crates/serde-yaml",
]

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4.44", features = ["clock", "serde", "std"], default-features = false }
clap = { version = "4.6.1", features = ["cargo", "derive", "env"] }
clap_complete = "4.6.2"
clap_mangen = "0.2.31"
console = "0.16.3"
libc = "0.2.186"
env_logger = "0.11.10"
git2 = { version = "0.20.4", default-features = false }
indicatif = "0.18.4"
log = "0.4.28"
mk_ext_prettytable = { version = "0.11.0", path = "crates/prettytable-rs", default-features = false, features = ["win_crlf"] }
mk_ext_serde_yaml = { version = "0.10.0", path = "crates/serde-yaml" }
rand = "0.8.6"
schemars = { version = "1.2.1", features = ["preserve_order"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
which = "8.0.2"
openssl = { version = "0.10.78", features = ["vendored"] }
ssh2 = "0.9.4"
regex = "1.11.1"
once_cell = "1.20.2"
pgp = "0.19.0"
hex = "0.4.3"
hashbrown = { version = "0.17.0", features = ["serde"] }
mlua = { version = "0.11.6", features = ["lua54", "serialize", "anyhow", "vendored"] }
toml = "1.1.2"
zeroize = { version = "1", features = ["derive"] }
reqwest = { version = "0.12.28", features = ["blocking", "json"] }
semver = "1.0.28"
glob = "0.3.2"
notify = "8"
ignore = "0.4"

[dev-dependencies]
assert_cmd = "2.2.1"
assert_fs = "1.1.3"
predicates = { version = "3.1.3", default-features = false, features = ["diff", "regex"] }
snapbox = "1.2.1"
tempfile = "3"
trycmd = "1.2.0"

[profile.release]
debug = 1

[profile.release-lto]
inherits = "release"
opt-level = 3
debug = "none"
strip = "symbols"
debug-assertions = false
overflow-checks = false
lto = "fat"
panic = "abort"
incremental = false
codegen-units = 1

[profile.deb]
inherits = "release"
debug = false

[package.metadata.deb]
name = "mk"
maintainer = "Edward Fitz Abucay gh:@ffimnsr"
section = "utils"
assets = [
  ["target/release/mk", "usr/bin/", "755"],
  ["target/man/man1/mk.1", "usr/share/man/man1/", "644"],
  ["target/man/man1/mk-clean-cache.1", "usr/share/man/man1/", "644"],
  ["target/man/man1/mk-completion.1", "usr/share/man/man1/", "644"],
  ["target/man/man1/mk-doctor.1", "usr/share/man/man1/", "644"],
  ["target/man/man1/mk-init.1", "usr/share/man/man1/", "644"],
  ["target/man/man1/mk-list.1", "usr/share/man/man1/", "644"],
  ["target/man/man1/mk-plan.1", "usr/share/man/man1/", "644"],
  ["target/man/man1/mk-run.1", "usr/share/man/man1/", "644"],
  ["target/man/man1/mk-schema.1", "usr/share/man/man1/", "644"],
  ["target/man/man1/mk-secrets.1", "usr/share/man/man1/", "644"],
  ["target/man/man1/mk-secrets-doctor.1", "usr/share/man/man1/", "644"],
  ["target/man/man1/mk-secrets-export-secret.1", "usr/share/man/man1/", "644"],
  ["target/man/man1/mk-secrets-init-vault.1", "usr/share/man/man1/", "644"],
  ["target/man/man1/mk-secrets-key.1", "usr/share/man/man1/", "644"],
  ["target/man/man1/mk-secrets-key-export-key.1", "usr/share/man/man1/", "644"],
  ["target/man/man1/mk-secrets-key-generate-key.1", "usr/share/man/man1/", "644"],
  ["target/man/man1/mk-secrets-key-import-key.1", "usr/share/man/man1/", "644"],
  ["target/man/man1/mk-secrets-key-list-keys.1", "usr/share/man/man1/", "644"],
  ["target/man/man1/mk-secrets-key-purge-key.1", "usr/share/man/man1/", "644"],
  ["target/man/man1/mk-secrets-list-keys.1", "usr/share/man/man1/", "644"],
  ["target/man/man1/mk-secrets-vault.1", "usr/share/man/man1/", "644"],
  ["target/man/man1/mk-secrets-vault-export-secret.1", "usr/share/man/man1/", "644"],
  ["target/man/man1/mk-secrets-vault-init-vault.1", "usr/share/man/man1/", "644"],
  ["target/man/man1/mk-secrets-vault-list-secrets.1", "usr/share/man/man1/", "644"],
  ["target/man/man1/mk-secrets-vault-purge-secret.1", "usr/share/man/man1/", "644"],
  ["target/man/man1/mk-secrets-vault-show-secret.1", "usr/share/man/man1/", "644"],
  ["target/man/man1/mk-secrets-vault-store-secret.1", "usr/share/man/man1/", "644"],
  ["target/man/man1/mk-update.1", "usr/share/man/man1/", "644"],
  ["target/man/man1/mk-validate.1", "usr/share/man/man1/", "644"],
  ["target/man/man1/mk-watch.1", "usr/share/man/man1/", "644"],
  ["COPYRIGHT", "usr/share/doc/mk/", "644"],
  ["LICENSE-MIT", "usr/share/doc/mk/", "644"],
  ["LICENSE-APACHE", "usr/share/doc/mk/", "644"],
  ["README.md", "usr/share/doc/mk/README", "644"],
]
extended-description = """\
mk is a simple task runner written in Rust. It is inspired by the make utility
but with a simpler syntax and more modern features. mk is designed to be
simple, fast, and easy to use.
"""
